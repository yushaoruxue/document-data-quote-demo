  <text x="695" y="485" fill="#f9fafb" font-family="Arial, sans-serif" font-size="22">0 auto substitutions</text>

  <line x1="1015" y1="280" x2="345" y2="365" stroke="#34d399" stroke-width="4"/>
  <polygon points="345,365 363,348 366,372" fill="#34d399"/>
  <line x1="1015" y1="280" x2="855" y2="365" stroke="#f59e0b" stroke-width="4"/>
