  <text x="185" y="450" fill="#f9fafb" font-family="Arial, sans-serif" font-size="22">3 exact approved matches</text>
  <text x="185" y="485" fill="#f9fafb" font-family="Arial, sans-serif" font-size="22">$176.00 total</text>

  <rect x="660" y="365" width="390" height="160" rx="16" fill="#3f2f13" stroke="#f59e0b" stroke-width="2"/>
