  <line x1="310" y1="220" x2="475" y2="220" stroke="#34d399" stroke-width="5"/>
  <polygon points="475,220 455,208 455,232" fill="#34d399"/>
  <line x1="725" y1="220" x2="890" y2="220" stroke="#34d399" stroke-width="5"/>
