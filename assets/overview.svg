  <text x="505" y="240" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">codes + fixed prices</text>

  <rect x="890" y="160" width="250" height="120" rx="14" fill="#1f2937" stroke="#6b7280"/>
  <text x="920" y="205" fill="#f9fafb" font-family="Arial, sans-serif" font-size="24" font-weight="700">Deterministic check</text>
